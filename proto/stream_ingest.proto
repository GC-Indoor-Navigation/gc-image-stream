syntax = "proto3";

package gc_image_stream.ingest.v1;

service FrameIngestService {
  rpc StreamFrames(stream IngestFrame) returns (IngestAck);
}

message IngestFrame {
  FrameMetadata metadata = 1;
  bytes image_bytes = 2;

  // Optional client-side size hint for validation and logging.
  uint32 content_length = 3;

  // Optional app-side send timestamp for network profiling.
  int64 app_sent_at_ms = 4;
}

message FrameMetadata {
  string session_id = 1;
  string camera_id = 2;
  string device_id = 3;
  uint64 frame_sequence = 4;

  int64 device_timestamp_ms = 5;
  int64 device_monotonic_ns = 6;

  uint32 width = 7;
  uint32 height = 8;
  string format = 9;
  uint32 orientation_deg = 10;
  uint32 fps_target = 11;

  string focus_mode = 12;
  bool exposure_locked = 13;
  bool white_balance_locked = 14;

  optional uint32 iso = 15;
  optional uint64 exposure_time_us = 16;
  optional float focal_length_mm = 17;
  optional string lens_facing = 18;
  optional int64 sensor_timestamp_ns = 19;

  optional float battery_level = 20;
  optional string network_status = 21;
  optional string app_version = 22;
}

message IngestAck {
  bool success = 1;
  uint64 received_count = 2;
  string message = 3;

  // Server-side timestamp for the final ack emission.
  int64 server_ack_timestamp_ms = 4;

  // Non-fatal warnings collected while the stream was processed.
  repeated string warnings = 5;
}
