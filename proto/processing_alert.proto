syntax = "proto3";

package gc_image_stream.processing_alerts.v1;

service ProcessingAlertService {
  rpc PublishAlert(AlertEvent) returns (AlertAck);
}

message AlertEvent {
  string event_id = 1;
  uint64 frame_set_id = 2;
  optional uint64 relay_run_id = 3;
  int64 timestamp_ms = 4;
  string severity = 5;
  double distance_m = 6;
  string joint = 7;
  string obstacle_id = 8;
  uint64 ttl_ms = 9;
  AlertSource source = 10;
}

message AlertSource {
  string processor = 1;
  repeated string camera_devices = 2;
  optional string session_id = 3;
}

message AlertAck {
  bool accepted = 1;
  bool duplicate = 2;
  bool expired = 3;
  string event_id = 4;
  string message = 5;
  int64 expires_at_ms = 6;
}
